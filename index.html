<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Prediktor Spaceman</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            background-color: #0d0d2b;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        input, button {
            padding: 10px;
            margin: 10px 0;
            font-size: 1em;
            width: 100%;
            max-width: 400px;
        }
        .output {
            margin-top: 20px;
            font-size: 1.2em;
            color: #00ffcc;
        }
        textarea {
            width: 100%;
            max-width: 400px;
            height: 100px;
        }
    </style>
</head>
<body>
    <h1>🎯 Prediktor Spaceman</h1>
    <p>Masukkan hasil crash sebelumnya (pisahkan dengan koma):</p>
    <textarea id="inputData" placeholder="Contoh: 1.2, 1.5, 2.3, 1.1, 5.0"></textarea>
    <br>
    <button onclick="prediksi()">🔮 Prediksi</button>

    <div class="output" id="hasilPrediksi"></div>

    <script>
        function prediksi() {
            const input = document.getElementById("inputData").value;
            const data = input.split(',').map(x => parseFloat(x.trim())).filter(x => !isNaN(x));

            if (data.length < 3) {
                document.getElementById("hasilPrediksi").innerText = "Minimal 3 data diperlukan untuk prediksi.";
                return;
            }

            const rataRata = data.reduce((a, b) => a + b) / data.length;
            const prediksi = (rataRata + data[data.length - 1]) / 2;

            let rekomendasi = "";

            if (prediksi > 2.0) {
                rekomendasi = "🚀 Potensi Terbang Tinggi - Pertimbangkan untuk..."; // Teks terpotong di gambar
            } else if (prediksi > 1.5) {
                rekomendasi = "⚖️ Stabil - Main aman dan tarik cepat.";
            } else {
                rekomendasi = "⚠️ Rawan Crash Cepat - Hati-hati.";
            }

            document.getElementById("hasilPrediksi").innerHTML = `
                <strong>Prediksi Crash Selanjutnya:</strong> ${prediksi.toFixed(2)}x<br><br>
                ${rekomendasi}
            `;
        }
    </script>
</body>
</html>
