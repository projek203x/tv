<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Spaceman Predictor - Detik Akhir</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: radial-gradient(circle at top, #1a1a4d 0%, #0a0a1f 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(20, 20, 50, 0.85);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 20px;
            padding: 30px 25px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.15);
            backdrop-filter: blur(10px);
        }
        h1 {
            text-align: center;
            font-size: 1.6em;
            color: #00ffcc;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
        }
        .subtitle {
            text-align: center;
            font-size: 0.8em;
            color: #888;
            margin-bottom: 25px;
        }
        .clock {
            text-align: center;
            font-size: 2.5em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.8);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .clock .detik-akhir {
            color: #00ffcc;
            text-shadow: 0 0 25px rgba(0, 255, 204, 1);
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 14px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }
        #btnStart {
            background: linear-gradient(135deg, #00ffcc, #00aa88);
            color: #0a0a1f;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }
        #btnStart:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 255, 204, 0.8); }
        #btnStart:active { transform: scale(0.97); }

        #btnClear {
            background: linear-gradient(135deg, #ff4d6d, #cc0033);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.4);
        }
        #btnClear:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(255, 77, 109, 0.7); }

        .status {
            text-align: center;
            font-size: 0.85em;
            margin-bottom: 15px;
            color: #ffaa00;
            min-height: 20px;
        }

        .log-box {
            background: #0a0a1f;
            border-radius: 12px;
            padding: 15px;
            height: 350px;
            overflow-y: auto;
            border: 1px solid rgba(0, 255, 204, 0.2);
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
        }
        .log-box::-webkit-scrollbar { width: 6px; }
        .log-box::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 3px; }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(0, 255, 204, 0.05);
            border-left: 3px solid #00ffcc;
            animation: slideIn 0.5s ease-out;
            font-size: 1.05em;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .log-time {
            color: #aaa;
            font-size: 0.9em;
            font-family: 'Courier New', monospace;
        }
        .log-time .highlight {
            color: #00ffcc;
            font-weight: bold;
        }
        .log-pred {
            font-weight: bold;
            color: #00ffcc;
            font-size: 1.05em;
        }
        .log-pred.down {
            color: #ff4d6d;
        }
        .log-arrow { margin-left: 6px; }

        .warning {
            margin-top: 15px;
            font-size: 0.75em;
            text-align: center;
            color: #666;
            line-height: 1.5;
        }
        .warning strong { color: #ff4d6d; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 SPACEMAN PREDICTOR</h1>
        <p class="subtitle">Simulasi Prediksi Detik Akhir</p>

        <div class="clock" id="clock">--:--.<span class="detik-akhir">--</span></div>

        <div class="buttons">
            <button id="btnStart" onclick="generateOne()">🎯 PREDIKSI</button>
            <button id="btnClear" onclick="clearLog()">🗑️ CLEAR</button>
        </div>

        <div class="status" id="status">Tekan PREDIKSI untuk memunculkan 1 hasil</div>

        <div class="log-box" id="logBox">
            <div style="color:#444; text-align:center; margin-top: 130px;">
                Belum ada prediksi...<br>
                <span style="font-size:0.8em;">Tekan tombol PREDIKSI</span>
            </div>
        </div>

        <p class="warning">
            ⚠️ <strong>PERINGATAN:</strong> Angka pada halaman ini <strong>ACAK (random)</strong>.<br>
            Bukan prediksi asli. Hanya untuk simulasi tampilan.
        </p>
    </div>

    <script>
        // Update jam real-time (detik tetap update biar kelihatan hidup)
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerHTML = `${h}:${m}.<span class="detik-akhir">${s}</span>`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Generate angka acak (SIMULASI)
        function generatePrediction() {
            const multiplier = (Math.random() * 4 + 1).toFixed(2);
            const isUp = Math.random() > 0.4;
            return { multiplier, direction: isUp ? 'UP' : 'DOWN' };
        }

        // Format waktu: HH.MM.SS (detik akhir di-highlight)
        function formatTime(date) {
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            return `${h}.${m}.<span class="highlight">${s}</span>`;
        }

        function addLog(timeHtml, multiplier, direction) {
            const logBox = document.getElementById('logBox');

            // Hapus placeholder
            if (logBox.querySelector('div[style*="text-align:center"]')) {
                logBox.innerHTML = '';
            }

            const item = document.createElement('div');
            item.className = 'log-item';
            const isUp = direction === 'UP';
            item.innerHTML = `
                <span class="log-time">${timeHtml}</span>
                <span class="log-pred ${isUp ? '' : 'down'}">
                    ${multiplier}x <span class="log-arrow">${isUp ? 'UP 📈' : 'DOWN 📉'}</span>
                </span>
            `;
            logBox.appendChild(item);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function generateOne() {
            const now = new Date();
            const timeHtml = formatTime(now);
            const { multiplier, direction } = generatePrediction();
            addLog(timeHtml, multiplier, direction);

            // Update status
            const status = document.getElementById('status');
            status.textContent = `✅ Prediksi terakhir: ${multiplier}x ${direction}`;
            status.style.color = direction === 'UP' ? '#00ffcc' : '#ff4d6d';
        }

        function clearLog() {
            const logBox = document.getElementById('logBox');
            logBox.innerHTML = `
                <div style="color:#444; text-align:center; margin-top: 130px;">
                    Belum ada prediksi...<br>
                    <span style="font-size:0.8em;">Tekan tombol PREDIKSI</span>
                </div>
            `;
            const status = document.getElementById('status');
            status.textContent = 'Tekan PREDIKSI untuk memunculkan 1 hasil';
            status.style.color = '#ffaa00';
        }

        // Bonus: tekan spasi = generate
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                generateOne();
            }
        });
    </script>
</body>
</html>
